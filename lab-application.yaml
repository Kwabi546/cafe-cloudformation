AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Application Template: Highly available cafe application. Builds the bastion, security
  groups, Multi-AZ RDS MariaDB, application secrets, launch template, Application Load
  Balancer and Auto Scaling group in the VPC created by the lab-network stack.
# CHANGE 1: Description rewritten. The class template provisioned one EC2 web server.

# This template creates:
#   Security Groups (load balancer, bastion, application servers, database)
#   Bastion host (SSH only from your workstation; also loads the database schema once)
#   RDS MariaDB instance (Multi-AZ) in the private subnets
#   Seven /cafe/* secrets in AWS Secrets Manager
#   Launch template, Target group, Application Load Balancer, Auto Scaling group
#   Target tracking scaling policy on average CPU
# CHANGE 2: The class resources WebServerInstance, DiskVolume and DiskMountPoint are removed.
#   A single hand-made instance with a 100 GiB data disk is replaced by an Auto Scaling
#   group of identical, disposable servers behind a load balancer. The cafe app keeps its
#   data in RDS, so the servers need no data disk.

######################
# Parameters section
######################

Parameters:

  NetworkStackName:
    Description: >-
      Name of an active CloudFormation stack that contains the networking
      resources, such as the VPC and subnets that will be used in this stack.
    Type: String
    MinLength: 1
    MaxLength: 255
    AllowedPattern: '^[a-zA-Z][-a-zA-Z0-9]*$'
    Default: lab-network

  # CHANGE 3: Default AMI changed from Amazon Linux 2 to Amazon Linux 2023. The earlier
  #   assignments (and install-basic.sh, which uses dnf) were built on Amazon Linux 2023.
  AmazonLinuxAMIID:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  # CHANGE 4: New parameter. Required by the assignment. The bastion accepts SSH only
  #   from this address. No default on purpose: you must supply it at deploy time, so
  #   the address is never stored in the repository.
  WorkstationIp:
    Description: Public IPv4 address of your workstation, without /32. Only this address can SSH to the bastion.
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}$'
    ConstraintDescription: Must be a single IPv4 address such as 203.0.113.10.

  # CHANGE 5: New parameters. Required by the assignment (Auto Scaling group size).
  AsgMinSize:
    Description: Minimum number of application servers in the Auto Scaling group.
    Type: Number
    Default: 2
    MinValue: 1

  AsgMaxSize:
    Description: Maximum number of application servers in the Auto Scaling group.
    Type: Number
    Default: 4
    MinValue: 1

  # CHANGE 6: New parameters for settings that are useful to change between runs.
  CpuTargetValue:
    Description: Target average CPU utilization (percent) for the target tracking scaling policy.
    Type: Number
    Default: 50
    MinValue: 10
    MaxValue: 90

  InstanceType:
    Description: EC2 instance type of the bastion and the application servers.
    Type: String
    Default: t3.micro

  KeyName:
    Description: Existing EC2 key pair used to SSH to the bastion.
    Type: AWS::EC2::KeyPair::KeyName
    Default: cafe-app-key-pair

  InstanceProfileName:
    Description: Existing IAM instance profile that lets servers read S3 and Secrets Manager (from the earlier assignments).
    Type: String
    Default: cafe-app-role

  AppBucketName:
    Description: Existing S3 bucket that holds the course files (cafe.zip, aws.zip, aws.phar, db.zip).
    Type: String
    MinLength: 3

  AppBucketPrefix:
    Description: Folder (key prefix) inside the bucket that holds the course files. No leading or trailing slash.
    Type: String
    Default: cafe-app

  DBPassword:
    Description: Password of the database admin user. Stored only in Secrets Manager. Not shown in the console or CLI.
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    AllowedPattern: '^[a-zA-Z0-9#%^*_+=.,-]*$'
    ConstraintDescription: 8 to 41 characters; letters, digits and # % ^ * _ + = . , - only.

  DBInstanceClass:
    Description: RDS instance class.
    Type: String
    Default: db.t3.micro

  DBEngineVersion:
    Description: MariaDB engine version.
    Type: String
    Default: 10.6.25

  DBAllocatedStorage:
    Description: RDS storage in GiB.
    Type: Number
    Default: 20
    MinValue: 20

  DBMultiAZ:
    Description: Create a standby database in the second Availability Zone.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  TimeZone:
    Description: PHP time zone for the cafe app (also stored as /cafe/timeZone).
    Type: String
    Default: America/New_York

  Currency:
    Description: Currency symbol shown by the cafe app (stored as /cafe/currency).
    Type: String
    Default: '$'

  ShowServerInfo:
    Description: Set to true to show which server handled the request (stored as /cafe/showServerInfo). Useful for load balancing tests.
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  ProjectName:
    Description: Value of the Project tag put on every resource.
    Type: String
    Default: cafe-cfn-assignment

######################
# Resources section
######################

Resources:

  ## Security groups
  # CHANGE 7: The class stack had one security group (HTTP and SSH open to 0.0.0.0/0).
  #   It is replaced by four security groups that only allow the traffic each tier needs.
  #   Sources are other security groups wherever possible, not IP ranges.

  # Load balancer: HTTP from the internet.
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Cafe load balancer. HTTP from the internet.
      VpcId:
        Fn::ImportValue:
          !Sub ${NetworkStackName}-VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: cafe-cfn-alb-sg
        - Key: Project
          Value: !Ref ProjectName

  # Bastion: SSH only from the workstation IP parameter (assignment requirement).
  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Cafe bastion. SSH from the workstation only.
      VpcId:
        Fn::ImportValue:
          !Sub ${NetworkStackName}-VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Sub '${WorkstationIp}/32'
      Tags:
        - Key: Name
          Value: cafe-cfn-bastion-sg
        - Key: Project
          Value: !Ref ProjectName

  # Application servers: HTTP only from the load balancer, SSH only from the bastion.
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Cafe application servers. HTTP from the load balancer, SSH from the bastion.
      VpcId:
        Fn::ImportValue:
          !Sub ${NetworkStackName}-VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref BastionSecurityGroup
      Tags:
        - Key: Name
          Value: cafe-cfn-app-sg
        - Key: Project
          Value: !Ref ProjectName

  # Database: MySQL port only from the application servers and the bastion (schema load).
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Cafe database. MySQL from the application servers and the bastion.
      VpcId:
        Fn::ImportValue:
          !Sub ${NetworkStackName}-VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroup
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref BastionSecurityGroup
      Tags:
        - Key: Name
          Value: cafe-cfn-db-sg
        - Key: Project
          Value: !Ref ProjectName

  ## Database (RDS)
  # CHANGE 8: New. Multi-AZ MariaDB in the two private subnets, not publicly accessible.
  #   Replaces the database that used to run on the EC2 instance.

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Cafe database subnets (private subnets in both AZs)
      SubnetIds:
        - Fn::ImportValue:
            !Sub ${NetworkStackName}-PrivateSubnetAID
        - Fn::ImportValue:
            !Sub ${NetworkStackName}-PrivateSubnetBID
      Tags:
        - Key: Name
          Value: cafe-cfn-db-subnet-group
        - Key: Project
          Value: !Ref ProjectName

  # DeletionPolicy and UpdateReplacePolicy are Delete so that deleting the stack does not
  # leave a billable final snapshot behind (the default for RDS is Snapshot).
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: mariadb
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      StorageType: gp2
      AllocatedStorage: !Ref DBAllocatedStorage
      MultiAZ: !Ref DBMultiAZ
      PubliclyAccessible: false
      MasterUsername: admin
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      BackupRetentionPeriod: 1
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: cafe-cfn-rds
        - Key: Project
          Value: !Ref ProjectName

  ## Application secrets
  # CHANGE 9: New. The seven /cafe/* secrets that set-app-parameters.sh used to create
  #   by hand are now created by the stack. The values come from parameters, and
  #   /cafe/dbUrl points at the RDS endpoint (the script used the EC2 public DNS name).
  #   The names must stay exactly /cafe/<name> because the PHP code reads them by name.

  SecretShowServerInfo:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/showServerInfo
      SecretString: !Ref ShowServerInfo
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SecretTimeZone:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/timeZone
      SecretString: !Ref TimeZone
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SecretCurrency:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/currency
      SecretString: !Ref Currency
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SecretDbUrl:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/dbUrl
      SecretString: !GetAtt Database.Endpoint.Address
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SecretDbName:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/dbName
      SecretString: cafe_db
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SecretDbUser:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/dbUser
      SecretString: admin
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SecretDbPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /cafe/dbPassword
      SecretString: !Ref DBPassword
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  ## Bastion host
  # CHANGE 10: New. SSH entry point in public subnet A. The class SSH rule allowed the
  #   whole internet; now only the bastion (which only accepts your workstation IP) can
  #   reach the private servers.
  #   It also loads the cafe_db schema into RDS once (the old install used db.zip on the
  #   EC2 instance). The password is read from Secrets Manager at run time so it never
  #   appears in user data. cfn-signal makes the stack wait for (and fail on) this step.
  Bastion:
    Type: AWS::EC2::Instance
    DependsOn:
      - Database
      - SecretDbPassword
      - SecretDbUrl
      - SecretDbUser
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmazonLinuxAMIID
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfileName
      NetworkInterfaces:
        - GroupSet:
            - !Ref BastionSecurityGroup
          AssociatePublicIpAddress: true
          DeviceIndex: 0
          DeleteOnTermination: true
          SubnetId:
            Fn::ImportValue:
              !Sub ${NetworkStackName}-SubnetID
      Tags:
        - Key: Name
          Value: cafe-cfn-bastion
        - Key: Project
          Value: !Ref ProjectName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -x
          dnf install -y mariadb105 unzip aws-cfn-bootstrap
          (
            set -e
            export AWS_DEFAULT_REGION=${AWS::Region}
            export MYSQL_PWD=$(aws secretsmanager get-secret-value --secret-id /cafe/dbPassword --query SecretString --output text)
            aws s3 cp s3://${AppBucketName}/${AppBucketPrefix}/db.zip /tmp/db.zip
            mkdir -p /tmp/db && unzip -o /tmp/db.zip -d /tmp/db
            SQL=$(find /tmp/db -name create-db.sql | head -1)
            mysql -h ${Database.Endpoint.Address} -u admin < "$SQL"
            mysql -h ${Database.Endpoint.Address} -u admin -e 'SELECT COUNT(*) AS products FROM cafe_db.product;'
          )
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource Bastion --region ${AWS::Region}

  ## Launch template
  # CHANGE 11: New. Replaces the single hand-configured instance. Each server installs the
  #   cafe app at boot, following install-basic.sh plus the steps of the Website on EC2 report
  #   (dnf packages, cafe.zip, aws.zip, aws.phar, time zone, php-fpm enabled). The database is
  #   NOT installed on the servers any more (no mariadb-server), it is RDS.
  #   IMDSv2 is required with hop limit 2, as in the earlier launch template.
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-cafe-template'
      LaunchTemplateData:
        ImageId: !Ref AmazonLinuxAMIID
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        IamInstanceProfile:
          Name: !Ref InstanceProfileName
        SecurityGroupIds:
          - !Ref AppSecurityGroup
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
          HttpEndpoint: enabled
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: cafe-cfn-app-server
              - Key: Project
                Value: !Ref ProjectName
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: cafe-cfn-app-server
              - Key: Project
                Value: !Ref ProjectName
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash -x
            dnf update -y
            dnf install -y httpd php php-fpm php-mysqlnd unzip
            aws s3 cp s3://${AppBucketName}/${AppBucketPrefix}/ /tmp/cafe-files/ --recursive --region ${AWS::Region}
            unzip -o /tmp/cafe-files/cafe.zip -d /var/www/html/
            unzip -o /tmp/cafe-files/aws.zip -d /var/www/html/cafe/
            cp /tmp/cafe-files/aws.phar /var/www/html/cafe/aws.phar
            chmod -R +r /var/www/html/cafe/
            sed -i '2i date.timezone = "${TimeZone}"' /etc/php.ini
            rm -f /var/www/html/index.html
            systemctl enable --now php-fpm
            systemctl enable --now httpd
            systemctl restart httpd

  ## Target group and load balancer
  # CHANGE 12: New. Target group health check hits /cafe/ every 15 s; two successes make
  #   a server healthy, two failures make it unhealthy (same values as the console build).
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-cafe-tg'
      VpcId:
        Fn::ImportValue:
          !Sub ${NetworkStackName}-VPCID
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /cafe/
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  # CHANGE 13: New. Internet-facing Application Load Balancer in both public subnets.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-cafe-alb'
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - Fn::ImportValue:
            !Sub ${NetworkStackName}-SubnetID
        - Fn::ImportValue:
            !Sub ${NetworkStackName}-PublicSubnetBID
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  ## Auto Scaling group
  # CHANGE 14: New. Servers run in the two private subnets. Minimum and maximum size are
  #   parameters (assignment requirement); desired capacity starts at the minimum.
  #   DependsOn Bastion: the servers start only after the database schema is loaded.
  #   ELB health checks let the group replace servers that fail the /cafe/ check.
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: Bastion
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-cafe-asg'
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref AsgMinSize
      MaxSize: !Ref AsgMaxSize
      DesiredCapacity: !Ref AsgMinSize
      VPCZoneIdentifier:
        - Fn::ImportValue:
            !Sub ${NetworkStackName}-PrivateSubnetAID
        - Fn::ImportValue:
            !Sub ${NetworkStackName}-PrivateSubnetBID
      TargetGroupARNs:
        - !Ref TargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - Key: Name
          Value: cafe-cfn-app-server
          PropagateAtLaunch: true
        - Key: Project
          Value: !Ref ProjectName
          PropagateAtLaunch: true

  # CHANGE 15: New. Target tracking policy keeps average CPU near CpuTargetValue by adding
  #   or removing servers between AsgMinSize and AsgMaxSize.
  ScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 120
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref CpuTargetValue

######################
# Outputs section
######################

Outputs:

  # CHANGE 16: The class output "URL" pointed at the web server's public DNS name. It now
  #   points at the load balancer, with the /cafe/ path of the cafe app.
  URL:
    Description: URL of the cafe application (through the load balancer)
    Value: !Sub 'http://${LoadBalancer.DNSName}/cafe/'

  # CHANGE 17: New outputs used by the verification steps in the report.
  BastionPublicIp:
    Description: Public IP of the bastion (SSH here from your workstation)
    Value: !GetAtt Bastion.PublicIp

  DatabaseEndpoint:
    Description: RDS endpoint (private, reachable only from inside the VPC)
    Value: !GetAtt Database.Endpoint.Address

  AutoScalingGroupName:
    Description: Name of the Auto Scaling group
    Value: !Ref AutoScalingGroup
